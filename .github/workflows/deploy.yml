name: Deploy parser

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/resource-parser.js dist/resource-parser.txt dist/resource-parser-lite.txt dist/resource-parser-native.txt dist/diagnostic-parser.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/resource-parser.js dist/resource-parser.txt dist/resource-parser-lite.txt dist/resource-parser-native.txt dist/diagnostic-parser.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Build #${GITHUB_RUN_NUMBER}" \
              --notes "Automated build from commit ${GITHUB_SHA}."
          fi
