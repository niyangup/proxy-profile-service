<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantumult X Resource Parser</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #0b0d12;
        color: #f2f4f8;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }
      main {
        width: min(680px, calc(100% - 40px));
      }
      h1 {
        margin-bottom: 12px;
        font-size: clamp(30px, 7vw, 52px);
        line-height: 1.05;
      }
      p {
        color: #aeb5c2;
        line-height: 1.7;
      }
      code {
        display: block;
        margin-top: 24px;
        padding: 18px;
        overflow-wrap: anywhere;
        border: 1px solid #303643;
        border-radius: 14px;
        background: #151922;
        color: #d9e7ff;
        line-height: 1.6;
      }
      a {
        color: #8fb8ff;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Private, local conversion for Quantumult X</p>
      <h1>Resource Parser</h1>
      <p>
        在 Quantumult X 的 <code>[general]</code> 中配置下方地址，即可直接解析本地或远程的 Clash
        YAML 与 Surge CONF。配置内容只在 Quantumult X 内处理。
      </p>
      <code>resource_parser_url = https://你的域名/resource-parser.js</code>
      <p><a href="/resource-parser.js">查看解析器文件</a></p>
    </main>
  </body>
</html>
